name: Build Android debug APK
on:
  workflow_dispatch:
    inputs:
      native:
        description: Compile llama.cpp native backend
        type: boolean
        default: false
      llama_ref:
        description: llama.cpp commit or tag
        required: false
        default: master
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform and build tools
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Fetch llama.cpp
        if: ${{ inputs.native == true }}
        env:
          LLAMA_REF: ${{ inputs.llama_ref }}
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/third_party/llama.cpp
          git -C app/src/main/cpp/third_party/llama.cpp checkout --detach "$LLAMA_REF"
      - name: Build debug APK
        run: |
          if [ '${{ inputs.native }}' = 'true' ]; then
            gradle --no-daemon :app:assembleDebug -PenableLlamaNative=true --stacktrace
          else
            gradle --no-daemon :app:assembleDebug --stacktrace
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnotherLife-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
