name: Build AnotherLife Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      native:
        description: Build llama.cpp native library
        type: boolean
        default: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Kotlin compilation and unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Fetch llama.cpp for ARM64 native build
        if: ${{ github.event_name == 'push' || inputs.native == true }}
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/third_party/llama.cpp
          git -C app/src/main/cpp/third_party/llama.cpp rev-parse HEAD | tee llama-cpp-revision.txt
      - name: Check llama.cpp API symbols
        run: |
          set -euo pipefail
          H=app/src/main/cpp/third_party/llama.cpp/include/llama.h
          for symbol in llama_model_load_from_file llama_model_chat_template llama_chat_apply_template llama_model_get_vocab llama_tokenize llama_get_memory llama_memory_clear llama_sampler_init_top_p llama_batch_get_one; do
            if ! grep -q "$symbol" "$H"; then echo "Missing llama.cpp API: $symbol"; exit 1; fi
          done
      - name: Check llama.cpp API surface
        if: ${{ github.event_name == 'push' || inputs.native == true }}
        run: |
          set -euo pipefail
          HEADER=app/src/main/cpp/third_party/llama.cpp/include/llama.h
          test -s "$HEADER"
          for symbol in llama_model_load_from_file llama_init_from_model llama_model_chat_template llama_chat_apply_template llama_get_memory llama_memory_clear llama_sampler_chain_init llama_sampler_sample llama_batch_get_one; do
            if ! grep -q "$symbol" "$HEADER"; then
              echo "::error::Missing llama.cpp API: $symbol"
              exit 1
            fi
          done
          echo "llama.cpp API declarations found; native compile is still required"
      - name: Build debug APK with llama.cpp
        if: ${{ github.event_name == 'push' || inputs.native == true }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug -PenableLlamaNative=true --stacktrace 2>&1 | tee native-build.log
      - name: Check APK contents and native library
        if: ${{ success() }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libanotherlife_llama.so' apk-contents.txt
          echo "ARM64 JNI library packaged in $APK"
      - name: Upload APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: AnotherLife-arm64-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: AnotherLife-build-diagnostics
          path: |
            llama-cpp-revision.txt
            native-build.log
            apk-contents.txt
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
